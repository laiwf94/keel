name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      # Format, Error Prone and javac lint as errors, every test (1,000 seeds per simulation
      # test), and the 90% line coverage floor.
      - name: Check
        run: ./gradlew check
      - name: Coverage
        if: always()
        run: |
          python3 - <<'PY'
          import re
          x = open('build/reports/jacoco/test/jacocoTestReport.xml').read()
          missed, covered = map(int, re.findall(r'<counter type="LINE" missed="(\d+)" covered="(\d+)"/>', x)[-1])
          print(f"line coverage {covered / (missed + covered):.1%}")
          PY
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: check-reports
          path: build/reports/

  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # Seeds 0..9999 of every simulation test. A failure prints the seed and the command that
      # replays it.
      - name: Simulate 10,000 seeds
        run: ./gradlew test --tests '*SimulationTest*' -Dkeel.sim.seeds=10000

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Known vulnerabilities in locked dependencies
        run: |
          go run github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.6.0 \
            scan source --lockfile gradle.lockfile

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t keel:ci .
      - name: Runs as non-root
        run: test "$(docker image inspect keel:ci --format '{{.Config.User}}')" = nonroot

  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Leader kill and partition on the compose cluster
        run: examples/demo.sh
